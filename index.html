<!DOCTYPE html>
<html lang="ar" dir="rtl" data-th="dark" data-ac="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>سريع · SAREE3</title>
<style>
/* ===== DESIGN TOKENS ===== */
:root{--bg:#0e1116;--s1:#161b22;--s2:#1e252e;--tx:#eceef2;--mu:#8d96a3;--bd:#262e39;--ac:#f5b942;--on-ac:#241a05;--ok:#3ecf8e;--dn:#f26d6d;
--r1:8px;--r2:14px;--r3:22px;--sp1:6px;--sp2:12px;--sp3:16px;--sh:0 10px 30px #0006;--fs0:12px;--fs1:14px;--fs2:16px;--fs3:22px;
--out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.2,.85,.25,1.25);--soft:cubic-bezier(.25,.8,.25,1);box-sizing:border-box}
[data-th=light]{--bg:#f4f5f8;--s1:#fff;--s2:#eceff4;--tx:#1a1d24;--mu:#667085;--bd:#e0e4eb;--sh:0 10px 30px #0002}
[data-ac=cyan]{--ac:#22d3ee;--on-ac:#042a31}[data-ac=violet]{--ac:#a78bfa;--on-ac:#1d1240}[data-ac=green]{--ac:#4ade80;--on-ac:#06280f}[data-ac=rose]{--ac:#fb7185;--on-ac:#3a0710}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:radial-gradient(110% 55% at 50% -8%,color-mix(in srgb,var(--ac) 13%,transparent),transparent 62%),var(--bg)}html,body{height:100%;margin:0}
body{background:transparent;color:var(--tx);font:var(--fs2)/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto;transition:background-color .25s var(--soft)}
:root{padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--bd);border-radius:var(--r2);padding:10px 14px;width:100%}
textarea{resize:none;line-height:1.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:var(--r2);display:grid;place-items:center;flex:none;background:var(--s1);border:1px solid var(--bd)}
.ib:active,.bt:active,nav button:active,.chip:active{transform:scale(.94)}
.ib,.bt,nav button,.chip{transition:transform .18s var(--out),background-color .2s var(--soft),border-color .2s var(--soft),color .2s var(--soft)}
header{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) var(--sp3) var(--sp1)}
header .t{flex:1;min-width:0}header h1{margin:0;font-size:26px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mu);font-size:var(--fs0)}
.warn{color:var(--dn)}
#fl{display:flex;gap:var(--sp1);padding:var(--sp1) var(--sp3);overflow-x:auto;flex:none}#fl:empty{display:none}
.chip{padding:6px 14px;border-radius:99px;background:var(--s1);border:1px solid var(--bd);font-size:13px;color:var(--mu);white-space:nowrap;min-height:34px}
.chip.on{color:var(--tx);border-color:var(--ac)}
main{flex:1;overflow-y:auto;padding:var(--sp1) var(--sp3) var(--sp2);display:flex;flex-direction:column;gap:var(--sp1);overscroll-behavior:contain}
.empty{margin:auto;text-align:center;color:var(--mu);padding:40px 12px;max-width:300px}.empty b{display:block;color:var(--tx);font-size:var(--fs2);margin-bottom:4px}
/* items */
.it{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:13px}.it.new{animation:in .4s var(--out)}
.it.ref{border-inline-start:3px solid var(--ac)}
.it.done .bd{opacity:.55}.it.done .tt,.it.done .tx{text-decoration:line-through}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent;transition:transform .22s var(--spring),background-color .15s,border-color .15s}
.ck svg{width:13px;height:13px;stroke-width:3}.done .ck{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.08)}
.bd{flex:1;min-width:0;cursor:pointer}.tt{font-weight:700;margin-bottom:2px;word-break:break-word}
.tx{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.tx a{color:var(--ac)}
.mt{display:flex;gap:8px;align-items:center;font-size:var(--fs0);color:var(--mu);margin-top:6px;flex-wrap:wrap}.mt svg{width:13px;height:13px}
.badge{color:var(--ac);display:inline-flex;gap:3px;align-items:center}
.pg{height:4px;width:60px;background:var(--s2);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac)}
.gr{display:grid;gap:4px;margin-top:8px;grid-template-columns:repeat(3,1fr)}.gr.n1{grid-template-columns:1fr}.gr.n2{grid-template-columns:1fr 1fr}
.gr img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--s2);cursor:zoom-in}.gr.n1 img{aspect-ratio:auto;max-height:240px}
.mb{width:36px;height:36px;display:grid;place-items:center;color:var(--mu);flex:none;margin:-4px -6px 0 0}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
/* sections */
.sec{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r2);padding:14px;text-align:start;width:100%}
.sec.on{border-color:var(--ac)}.sec .ico{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--s2);border-radius:12px;flex:none}
.sec .bd{cursor:pointer}.sec b{display:block}
/* composer */
#cp{padding:var(--sp1) var(--sp3) var(--sp2);border-top:1px solid var(--bd);background:var(--bg)}#cp[hidden]{display:none}
#ty{display:flex;gap:var(--sp1);margin-bottom:8px}#ty .chip{min-height:30px;padding:3px 13px;font-size:12px}
#pv{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}#pv:empty{display:none}
#pv div{position:relative;flex:none}#pv img{height:52px;width:52px;object-fit:cover;border-radius:10px}
#pv button{position:absolute;top:-4px;left:-4px;background:var(--dn);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}#pv button svg{width:10px;height:10px}
.rw{display:flex;gap:2px;align-items:flex-end;background:var(--s1);border:1px solid var(--bd);border-radius:28px;padding:5px;transition:border-color .2s var(--soft),box-shadow .2s var(--soft)}.rw:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
#cp .rw .ib{background:transparent;border:0;width:40px;height:40px;color:var(--mu)}#cp #bm[data-v=listening]{background:var(--dn);color:#fff;border-radius:50%}
#in{max-height:130px;background:transparent;border:0;padding:10px 4px;border-radius:0}#in:focus-visible{outline:none}
.sd{background:var(--ac);color:var(--on-ac);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none;transition:transform .22s var(--spring)}.sd:active{transform:scale(.88)}.sd svg{transform:scaleX(-1)}
#bm[data-v=listening]{background:var(--dn);color:#fff;border-color:var(--dn)}
/* nav */
nav{display:flex;border-top:1px solid var(--bd);background:var(--s1);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);min-height:54px;position:relative}
nav button svg{width:54px;height:30px;padding:5px 17px;border-radius:99px;transition:background-color .25s var(--soft)}nav button.on{color:var(--ac);font-weight:700}nav button.on svg{background:color-mix(in srgb,var(--ac) 18%,transparent)}
/* sheets */
dialog{border:0;color:var(--tx);background:var(--bg);padding:var(--sp3);width:min(100vw,680px);max-height:90dvh;overflow:auto;margin:auto auto 0;border-radius:var(--r3) var(--r3) 0 0;padding-bottom:calc(var(--sp3) + env(safe-area-inset-bottom,0px));box-shadow:var(--sh)}
dialog[open]{animation:sheet .32s var(--out) both}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
@keyframes sheet{from{transform:translateY(100%)}}
dialog h3{margin:0 0 var(--sp2);font-size:var(--fs2)}dialog::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--bd);margin:-6px auto 14px}
.ac{display:flex;flex-direction:column;gap:6px}
.ac button,.bt{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);min-height:46px}
.ac button{justify-content:flex-start}.bt{justify-content:center}.bt.p{background:var(--ac);color:var(--on-ac);font-weight:700;border-color:var(--ac)}.bt.d,.ac .d{color:var(--dn)}
.ro{display:flex;gap:8px;margin-top:var(--sp2)}.ro>*{flex:1}
.fd{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--sp2)}.fd label{font-size:13px;color:var(--mu)}
.sg{display:flex;background:var(--s2);border-radius:10px;padding:2px}.sg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--mu);min-height:34px}.sg button.on{background:var(--ac);color:var(--on-ac)}
.stp{display:flex;gap:8px;align-items:center;padding:6px 0}.stp input[type=text]{padding:6px 10px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r2);padding:4px 14px;margin-bottom:var(--sp2)}
.card h4{font-size:13px;color:var(--mu);margin:10px 0 2px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:var(--fs1)}.row:last-child{border:0}
.sw{width:44px;height:26px;border-radius:99px;background:var(--s2);position:relative;border:1px solid var(--bd);flex:none}.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:right .15s var(--out)}.sw.on{background:var(--ac)}.sw.on::after{right:21px;background:#fff}
.dot{width:28px;height:28px;border-radius:50%;margin-inline-start:6px;border:2px solid transparent}.dot.on{border-color:var(--tx)}
.mu{color:var(--mu);font-size:var(--fs0);line-height:1.7}
#ts{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50}
.to{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:var(--r2);font-size:var(--fs1);display:flex;gap:12px;align-items:center;pointer-events:auto;animation:in .3s var(--out) both;box-shadow:var(--sh)}.to b{color:var(--ac);cursor:pointer;filter:brightness(.7)}
#lb{background:#000;color:#fff;max-width:none;width:100vw;height:100dvh;max-height:none;border-radius:0;padding:0;overflow:hidden;margin:0}
#lb img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:86%;transition:transform .12s}
#lb .bar{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;padding:10px;z-index:2;justify-content:center}
#lb button{background:#fff2;border-radius:12px;width:44px;height:44px;display:grid;place-items:center}
#lb .nv{position:absolute;top:50%;z-index:2;border-radius:50%}#lb::before{display:none}#lb[open]{animation:fade .2s both}@keyframes fade{from{opacity:0}}
.grp{font-size:12px;font-weight:600;color:var(--mu);margin:10px 4px 0}.grp:first-child{margin-top:2px}.pg.wide{width:100%;margin-top:8px}
.it{transition:transform .15s var(--out)}.it:active{transform:scale(.992)}
#st{display:flex;gap:8px;padding:4px var(--sp3) 8px;overflow-x:auto;flex:none;scrollbar-width:none}#st::-webkit-scrollbar{display:none}#st[hidden]{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:99px;background:var(--s1);border:1px solid var(--bd);color:var(--mu);white-space:nowrap;font-size:14px;min-height:40px;transition:background-color .3s var(--soft),color .3s var(--soft),border-color .3s var(--soft),box-shadow .3s var(--soft),transform .18s var(--out)}
.tab:active{transform:scale(.94)}.tab.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 30%,transparent)}.tab.add{padding:7px 12px}
#mn{transition:opacity .12s var(--soft),transform .12s var(--soft)}#mn.out{opacity:0;transform:translateX(calc(var(--dx,0px)*-1))}#mn.in,.tin{animation:swapIn .34s var(--out) both}
@keyframes swapIn{from{opacity:0;transform:translateX(var(--dx,0px))}}
.sd.off{opacity:.35;transform:scale(.92)}
.ei{width:64px;height:64px;border-radius:22px;background:var(--s2);display:grid;place-items:center;margin:0 auto 12px;color:var(--ac)}.ei svg{width:28px;height:28px}
/* intro */
#intro{--ia:#f5b942;position:fixed;inset:0;z-index:100;background:#090b10;color:#fff;overflow:hidden;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;clip-path:circle(150% at 50% 45%);transition:clip-path .8s cubic-bezier(.76,0,.24,1)}
#intro.out{clip-path:circle(0% at 50% 45%)}
#intro .au{position:absolute;inset:-20%;background:radial-gradient(40% 35% at 30% 40%,#f5b94238,transparent 70%),radial-gradient(35% 35% at 72% 62%,#22d3ee26,transparent 70%);animation:drift 6s ease-in-out infinite alternate}
#intro .mk{position:relative;display:grid;place-items:center}
#intro .lg{position:relative;width:96px;height:96px;border-radius:30px;background:linear-gradient(145deg,#ffd27a,var(--ia) 55%,#e39a1f);display:grid;place-items:center;overflow:hidden;box-shadow:0 20px 60px #f5b94255,inset 0 1px 0 #fff6;animation:pop .8s cubic-bezier(.2,.85,.25,1.25) both}
#intro .lg::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff7 50%,transparent 65%);transform:translateX(-120%);animation:shine 1s 1.1s ease-out forwards}
#intro .rg{position:absolute;inset:0;border-radius:30px;border:1.5px solid #f5b94299;animation:ring 1.8s .5s ease-out infinite}
#intro svg{width:50px;height:50px;stroke:#2a1c02;fill:#2a1c02;fill-opacity:0;stroke-width:1.8;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .35s ease-out forwards,fillin .4s 1s ease-out forwards}
#intro b{font-size:50px;line-height:1.15;margin-top:16px;opacity:0;filter:blur(14px);animation:focus .9s .9s var(--out) forwards}
#intro i{font-style:normal;font-size:14px;font-weight:600;color:var(--ia);letter-spacing:.32em;opacity:0;animation:track 1.1s 1.2s var(--out) forwards}
#intro span{color:#9aa3b2;opacity:0;animation:rise .7s 1.6s var(--out) forwards}
#intro .ln{position:absolute;left:0;right:0;margin:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:132px;height:3px;border-radius:9px;background:#ffffff1c;overflow:hidden}
#intro .ln u{display:block;height:100%;background:var(--ia);transform-origin:right;transform:scaleX(0);animation:fill 2.4s .2s cubic-bezier(.3,.7,.2,1) forwards}
#intro small{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));color:#6d7686;font-size:12px;opacity:0;animation:rise .6s 1.8s forwards}
@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-10deg)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fillin{to{fill-opacity:1}}@keyframes shine{to{transform:translateX(120%)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}@keyframes focus{to{opacity:1;filter:blur(0)}}@keyframes track{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.32em}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fill{to{transform:scaleX(1)}}@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
@keyframes appIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
.booted #hd,.booted #st,.booted #fl,.booted #mn,.booted #cp,.booted nav{animation:appIn .6s var(--out) both}.booted #st{animation-delay:.05s}.booted #mn{animation-delay:.1s}.booted #cp{animation-delay:.15s}.booted nav{animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
#pv .fchip{width:auto!important;min-width:96px;padding:0 10px;font-size:12px;display:flex;align-items:center;gap:6px;border-radius:10px;background:var(--bg2,#1b2029);color:inherit}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fchip2{font-size:12px;padding:6px 10px}
.cols{flex-wrap:wrap;align-items:center;gap:10px}.cdot{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid #667;padding:0;font-size:13px;color:#889}.cdot.on{outline:2px solid #fff;outline-offset:2px}
.ap{display:flex;gap:6px;align-items:center;width:100%}.ap audio{flex:1;min-width:0;height:36px}
#br.recording{width:auto;min-width:68px;padding:0 10px;border-radius:20px;background:#dc2626;color:#fff;font-size:13px;animation:rp 1.2s infinite}@keyframes rp{50%{opacity:.7}}
#mn.in,.tin{animation:fadeQ .14s ease-out both}@keyframes fadeQ{from{opacity:0}to{opacity:1}}
button,nav button,.tab,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<header id="hd"></header>
<div id="st" role="tablist" aria-label="الأقسام" hidden></div>
<div id="fl"></div>
<main id="mn" aria-live="polite"></main>
<div id="cp" hidden>
 <div id="ty" role="group" aria-label="نوع العنصر"></div>
 <div id="pv"></div>
 <div class="rw">
  <button class="ib" id="ba" data-i="plus" aria-label="إرفاق صورة"></button>
  <textarea id="in" rows="1" placeholder="اكتب شيئًا…" aria-label="اكتب"></textarea>
  <button class="ib" id="bm" data-i="mic" aria-label="إملاء صوتي" hidden style="display:none"></button>
  <button class="ib" id="br" aria-label="تسجيل صوتي"></button>
  <button class="sd" id="bs" data-i="send" aria-label="حفظ"></button>
 </div>
</div>
<nav id="nv" aria-label="التنقل الرئيسي"></nav>
<div id="ts" role="status"></div>
<dialog id="sh"></dialog>
<dialog id="lb"><div class="bar"><button data-i="plus" id="zi" aria-label="تكبير"></button><button data-i="minus" id="zo" aria-label="تصغير"></button><button data-i="x" id="lx" aria-label="إغلاق"></button></div><button class="nv" id="lp" style="right:8px" data-i="right" aria-label="السابقة"></button><button class="nv" id="ln" style="left:8px" data-i="left" aria-label="التالية"></button><img id="li" alt="صورة"></dialog>
<input type="file" id="fg" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.json,.csv" multiple hidden>
<input type="file" id="fc" accept="image/*" capture="environment" hidden>
<input type="file" id="fi" accept=".json,application/json" hidden>
<div id="intro" aria-hidden="true"><div class="au"></div><div class="mk"><em class="rg"></em><div class="lg"><svg viewBox="0 0 24 24"><path pathLength="1" d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div></div><b>سريع</b><i>SAREE3</i><span>احفظها قبل لا تنساها.</span><div class="ln"><u></u></div><small>المس للتخطي</small></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ===================== CONFIG ===================== */
const D=document,$=s=>D.querySelector(s);
const CFG={app:'saree3',ver:3,db:'saree3-v3',dbv:1,legacyDb:'quick-notes',defSec:'sec_quick',

async function legacyImport(){/* one-time adapter for the previous 'quick-notes' database */
 try{if(!indexedDB.databases||!(await indexedDB.databases()).some(x=>x.name==CFG.legacyDb))return 0;
  const old=await new Promise((ok,no)=>{const r=indexedDB.open(CFG.legacyDb);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  if(!old.objectStoreNames.contains('items')){old.close();return 0}
  const rows=await new Promise((ok,no)=>{const q=old.transaction('items').objectStore('items').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});old.close();
  const items=(await Promise.all(rows.map(Model.legacy))).filter(Boolean);if(items.length)await DB.put('items',...items);return items.length}catch(e){return 0}}

  navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
